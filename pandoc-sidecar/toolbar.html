<style>
  /* Actions & options bar: screen only, never printed */
  .md-toolbar {
    position: sticky; top: 0; z-index: 900;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.35em 1.1em;
    margin: 0 0 1em; padding: 0.45em 0;
    font: 12px/1.4 Segoe UI, Calibri, Arial, sans-serif; color: #555;
    background: #fff; border-bottom: 1px solid #e3e7ec;
  }
  .md-toolbar .tb-crumbs { flex-basis: 100%; color: #888; overflow-wrap: anywhere; }
  .md-toolbar .tb-crumbs a { color: #1a5c8e; text-decoration: none; }
  .md-toolbar .tb-crumbs a:hover { text-decoration: underline; }
  .md-toolbar .tb-crumbs .tb-sep { margin: 0 0.35em; color: #aaa; }
  .md-toolbar .tb-crumbs .tb-here { color: #333; }
  .md-toolbar label { display: inline-flex; align-items: center; gap: 0.3em; cursor: pointer; }
  .md-toolbar .tb-spacer { flex: 1; }
  .md-toolbar a.tb-btn, .md-toolbar button.tb-btn {
    font: inherit; padding: 0.15em 0.7em; border-radius: 3px; cursor: pointer;
    border: 1px solid #1a3a5c; background: #fff; color: #1a3a5c; text-decoration: none;
  }
  .md-toolbar button.tb-btn.tb-primary { background: #1a3a5c; color: #fff; }
  .md-toolbar [hidden] { display: none !important; }
  @media print { .md-toolbar { display: none !important; } }
  @media screen and (prefers-color-scheme: dark) {
    .md-toolbar { background: #0d1117; border-bottom-color: #30363d; color: #8b949e; }
    .md-toolbar .tb-crumbs a { color: #58a6ff; }
    .md-toolbar .tb-crumbs .tb-here { color: #c9d1d9; }
    .md-toolbar a.tb-btn, .md-toolbar button.tb-btn { background: #0d1117; border-color: #2f5a80; color: #79b8e8; }
    .md-toolbar button.tb-btn.tb-primary { background: #1f3a55; color: #fff; }
  }
</style>
<div class="md-toolbar" role="toolbar" aria-label="Page options">
  <nav class="tb-crumbs" id="tb-crumbs" aria-label="Folder path" hidden></nav>
  <label title="Show a table of contents at the top (H1-H3). Reloads the page."><input type="checkbox" id="tb-toc"> Contents</label>
  <label title="When printing or saving a PDF, start each H2 section on a new page. No effect on screen."><input type="checkbox" id="tb-breaks"> Page breaks</label>
  <label id="tb-props-wrap" hidden title="Include the tags, related notes and 'Linked from' list when printing or saving a PDF. They always show on screen. Leave off for PDFs going outside IT: these links only work on this server."><input type="checkbox" id="tb-props"> Print tags &amp; links</label>
  <span class="tb-spacer"></span>
  <a class="tb-btn" href="/_recent" title="Notes changed recently across the whole vault, newest first">Recent</a>
  <a class="tb-btn" id="tb-obsidian" hidden title="Open this note in the Obsidian app on this computer">Open in Obsidian</a>
  <button type="button" class="tb-btn tb-primary" id="tb-print" title="Print, or pick 'Save as PDF' as the printer to get a PDF">Print / PDF</button>
</div>
<script>
// Runs at the top of <body>, so wait for the rest of the page
document.addEventListener('DOMContentLoaded', function () {
  function meta(name) {
    var m = document.querySelector('meta[name="' + name + '"]');
    return m ? m.content : '';
  }
  // The file actually rendered (a directory URL may be serving its index.md)
  var file = meta('md-path');
  if (!file) return;
  var sfx = (location.pathname.match(/(\.(break|toc|compact|full|meta))+$/) || [''])[0];
  // .full and .compact are old layout names: accepted, dropped from new URLs
  var state = {
    toc: /\.toc/.test(sfx),
    breaks: /\.break/.test(sfx),
    meta: /\.meta/.test(sfx)
  };
  var base = file.split('/').map(encodeURIComponent).join('/');

  // Breadcrumbs: Home > folder > folder > note; folders open Caddy's listing
  var crumbs = document.getElementById('tb-crumbs');
  var parts = file.replace(/^\//, '').split('/');
  function crumbLink(text, href, title) {
    var a = document.createElement('a');
    a.textContent = text;
    a.href = href;
    a.title = title;
    return a;
  }
  function sep() {
    var s = document.createElement('span');
    s.className = 'tb-sep';
    s.textContent = '\u203A';
    return s;
  }
  crumbs.appendChild(crumbLink('Home', '/', 'Top of the vault'));
  var href = '/';
  parts.slice(0, -1).forEach(function (dir) {
    href += encodeURIComponent(dir) + '/';
    crumbs.appendChild(sep());
    crumbs.appendChild(crumbLink(dir, href, 'Open the ' + dir + ' folder'));
  });
  var here = document.createElement('span');
  here.className = 'tb-here';
  here.textContent = parts[parts.length - 1].replace(/\.md$/i, '');
  crumbs.appendChild(sep());
  crumbs.appendChild(here);
  crumbs.hidden = false;
  function url(s) {
    return base + (s.toc ? '.toc' : '') + (s.breaks ? '.break' : '') + (s.meta ? '.meta' : '')
      + location.hash;
  }
  // Any old suffix (.full, .compact) is normalised away
  if (location.pathname !== url(state).replace(/#.*$/, '')) {
    history.replaceState(null, '', url(state));
  }

  var toc = document.getElementById('tb-toc');
  toc.checked = state.toc;
  toc.addEventListener('change', function () {
    state.toc = toc.checked;
    location.href = url(state);   // the contents are built by the server
  });

  // Print-only options: no reload, just a class on <html> and the URL
  function printToggle(box, key, cls) {
    box.checked = document.documentElement.classList.contains(cls);
    box.addEventListener('change', function () {
      state[key] = box.checked;
      document.documentElement.classList.toggle(cls, box.checked);
      history.replaceState(null, '', url(state));
    });
  }
  printToggle(document.getElementById('tb-breaks'), 'breaks', 'page-breaks');
  if (document.querySelector('.doc-props, .backlinks')) {
    document.getElementById('tb-props-wrap').hidden = false;
    printToggle(document.getElementById('tb-props'), 'meta', 'print-props');
  }

  // A collapsed "Linked from" would print as an empty box: open it for print
  window.addEventListener('beforeprint', function () {
    document.querySelectorAll('.backlinks details').forEach(function (d) { d.open = true; });
  });

  var vault = meta('md-vault');
  if (vault) {
    var ob = document.getElementById('tb-obsidian');
    ob.href = 'obsidian://open?vault=' + encodeURIComponent(vault)
      + '&file=' + encodeURIComponent(file.replace(/^\//, ''));
    ob.hidden = false;
  }

  document.getElementById('tb-print').addEventListener('click', function () { window.print(); });
});
</script>
